name: Refresh calendar and publish website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: northern-tier-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/calendar-requirements.txt
      - run: pip install -r scripts/calendar-requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/sync_calendar.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp *.html manifest.json service-worker.js _site/
          cp -r css js images downloads data _site/
      - name: Stamp canonical nav/footer into the build
        run: python scripts/build_pages.py --write --root _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
