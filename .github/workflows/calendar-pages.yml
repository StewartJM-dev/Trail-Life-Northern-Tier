name: Refresh calendar and publish website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: northern-tier-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A retry must build today's main branch, not the original run's SHA.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/calendar-requirements.txt
      - run: pip install -r scripts/calendar-requirements.txt
      - run: pip install -r scripts/gallery-requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/sync_calendar.py
      - run: python scripts/sync_troop_events.py
      - run: python scripts/sync_gallery.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp *.html manifest.json service-worker.js _site/
          cp -r css js images downloads data _site/
          # admin-login.html and admin-dashboard.html are internal tools only
          # (hardcoded credentials, direct links to the content Google Sheets)
          # and must never be published to the public site.
          rm -f _site/admin-login.html _site/admin-dashboard.html
      - name: Stamp canonical nav/footer into the build
        run: python scripts/build_pages.py --write --root _site
      - name: Check that this build is still current
        id: current
        run: |
          built_revision="$(git rev-parse HEAD)"
          current_revision="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$current_revision" ]; then
            echo "::error::Could not verify the current main revision; refusing to publish."
            exit 1
          fi
          if [ "$built_revision" = "$current_revision" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Newer code arrived during this build; skipping this outdated deployment."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.publish == 'true'
        with:
          path: _site
          # Each retry gets a distinct artifact, avoiding duplicate-name errors.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.publish == 'true'
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Open an issue if the scheduled refresh failed
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled site refresh failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled calendar refresh + deploy failed.\n\nRun: ${runUrl}\n\nThe live site still shows the last good data (publishing only overwrites it on success), but the calendar won't update again until this is fixed.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation-failure',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation-failure'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }
